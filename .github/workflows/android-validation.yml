name: Android validation

on:
  pull_request:
    branches: [main, feat/cdn-sni-auto-ir-us]
  push:
    branches: [main, feature/cultural-theme-picker, feature/zedsecure-config-finder-on-cdn-sni]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Reinstall checksum-pinned Aether v2.3.0 Android runtimes
        run: bash scripts/install_aether_core.sh

      - name: Verify bundled native Aether runtimes
        run: python3 scripts/verify_native_cores.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # app/build.gradle.kts intentionally requires a signing configuration at
      # configuration time, even for debug tasks. Use a throwaway CI-only key;
      # never use this key for distributable/release APKs.
      - name: Create temporary CI signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore ci-validation.keystore \
            -storepass ci-validation-password \
            -keypass ci-validation-password \
            -alias ci-validation \
            -dname "CN=CI Validation" \
            -keyalg RSA -keysize 2048 -validity 2
          cat > keystore.properties <<'EOF'
          storeFile=ci-validation.keystore
          storePassword=ci-validation-password
          keyAlias=ci-validation
          keyPassword=ci-validation-password
          EOF

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon clean :app:assembleDebug :app:testDebugUnitTest

      - name: Verify native cores in the assembled APKs
        run: python3 scripts/verify_apk_native_cores.py

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v5
        with:
          name: G-ST-VPN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Stable public download link: https://github.com/<repo>/releases/tag/latest-debug
      - name: Publish APK to the latest-debug release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug "$apk" --prerelease \
            --title "Latest debug build" \
            --notes "Auto-built from ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
