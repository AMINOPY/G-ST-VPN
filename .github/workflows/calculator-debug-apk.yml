name: Build calculator-enabled RADAR VPN debug APK

on:
  push:
    branches:
      - feature/calculator-launcher-radar-restored
  pull_request:
    branches:
      - fix/radar-vpn-full-restoration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-radar-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 37 platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ ! -f "$SDK_ROOT/platforms/android-37/android.jar" ]; then
            sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          fi
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          test -f "$SDK_ROOT/platforms/android-37/android.jar"
          sdkmanager --list_installed

      - name: Create temporary CI signing key for Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="ci-temporary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair -noprompt -keystore ci-temporary.keystore \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" -alias ci-temporary \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Temporary CI Key,O=RADAR VPN,C=US"
          {
            echo "storeFile=ci-temporary.keystore"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=ci-temporary"
            echo "keyPassword=$STORE_PASS"
          } > keystore.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run calculator unit tests and assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RADAR-VPN-calculator-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
