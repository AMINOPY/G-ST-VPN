name: Build restored Radar VPN with Calculator

on:
  push:
    branches:
      - feature/calculator-on-radar-restoration
      - feature/omnicalc-hidden-calculator
      - feature/radar-rdy-core-results
  pull_request:
    branches:
      - fix/radar-vpn-full-restoration
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-radar-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore ci-validation.keystore \
            -storepass ci-validation-password \
            -keypass ci-validation-password \
            -alias ci-validation \
            -dname "CN=CI Validation" \
            -keyalg RSA -keysize 2048 -validity 2
          cat > keystore.properties <<'EOF'
          storeFile=ci-validation.keystore
          storePassword=ci-validation-password
          keyAlias=ci-validation
          keyPassword=ci-validation-password
          EOF

      - name: Build debug APK and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: G-ST-VPN-radar-calculator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
