name: Build RADAR VPN debug APK

on:
  push:
    branches:
      - feature/radar-theme
      - feature/last-of-us-survival-theme
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          # Current Android SDK publishes API 37 under android-37.0; AGP legacy DSL looks for android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android compile SDK and run unit tests/build
        run: |
          set -euo pipefail
          grep -n 'compileSdk' app/build.gradle.kts
          grep -n 'compileSdk = 37' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: RADAR-VPN-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
